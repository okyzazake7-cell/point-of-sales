# Satu instans Cloud Run = 512 MiB. Tiap proses Apache+PHP memakan 30–60 MB,
# jadi pekerjanya dibatasi sepuluh — dan konkurensi layanan Cloud Run diset
# sama (langkah pemilik), supaya permintaan kesebelas menunggu di Cloud Run
# atau membuka instans baru, bukan menghabiskan memori instans ini.
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        10
    MaxConnectionsPerChild   1000
</IfModule>
