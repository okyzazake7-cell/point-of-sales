# Aishii POS di Cloud Run. Port dari $PORT (Cloud Run menentukannya).

# Tanpa ServerName global Apache mencetak "AH00558: Could not reliably
# determine the server's fully qualified domain name" di tiap nyala — kalimat
# yang terbaca seperti galat di log yang diminta dilaporkan pemilik (langkah
# P7). Nama ini tidak dipakai untuk tautan: Laravel membaca APP_URL.
ServerName localhost

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Aturan public/.htaccess ditulis di sini, dan .htaccess tidak
        # dibaca: satu pembacaan berkas lebih sedikit di tiap permintaan.
        AllowOverride None
        Require all granted
        Options -Indexes -MultiViews +FollowSymLinks

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Berkas Vite bernama sidik isi: aman disimpan peramban setahun, dan
    # tiap yang tersimpan adalah satu permintaan yang tidak melewati Worker.
    <LocationMatch "^/build/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Cloud Run sudah mencatat tiap permintaan; Apache cukup melapor galat.
    ErrorLog /proc/self/fd/2
    LogLevel warn
</VirtualHost>
